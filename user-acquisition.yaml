AWSTemplateFormatVersion: 2010-09-09
Description: >-
 puzzle-box-serverless - project domain

Transform:
 - AWS::Serverless-2016-10-31

Globals:
 Api:
  Cors:
   AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
   AllowHeaders: "'content-type'"
   AllowOrigin: "'*'"

Resources:
 requestAccessFunction:
  Type: AWS::Serverless::Function
  Properties:
   Handler: src/user-acquisition/adapters/primary/request-access/request-access-adapter.requestAccessHandler
   Runtime: nodejs20.x
   Architectures:
    - x86_64
   MemorySize: 128
   Timeout: 100
   Description: Request Access on jigjoy.io website
   Policies:
    - Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action: ses:SendEmail
          Resource: "*"
    - DynamoDBCrudPolicy:
        TableName: !Ref AccessRequestTable
   Environment:
    Variables:
      ACCESS_REQUEST_TABLE: !Ref AccessRequestTable
      FROM_ADDRESS: "{{resolve:secretsmanager:vars:SecretString:FromAddress}}"
      ADMIN_EMAIL_1: "{{resolve:secretsmanager:vars:SecretString:AdminEmail1}}"
      ADMIN_EMAIL_2: "{{resolve:secretsmanager:vars:SecretString:AdminEmail2}}"
   Events:
    Api:
     Type: Api
     Properties:
      Path: /user-acquisition/request-access
      Method: POST
  Metadata: #Manage esbuild properties
   BuildMethod: esbuild
   BuildProperties:
    Minify: true
    Target: "es2020"
    Sourcemap: true
    EntryPoints:
     - src/user-acquisition/adapters/primary/request-access/request-access-adapter.ts

 AccessRequestTable:
  Type: AWS::DynamoDB::Table
  Properties:
   BillingMode: PAY_PER_REQUEST
   TableName: AccessRequest
   AttributeDefinitions:
    - AttributeName: id
      AttributeType: S
    - AttributeName: email
      AttributeType: S
   KeySchema:
    - AttributeName: id
      KeyType: HASH
   GlobalSecondaryIndexes:
    - IndexName: userGSI
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      Projection:
        ProjectionType: ALL

Outputs:
 UserAcquisitionApiGatewayUrl:
  Description: "API Gateway URL"
  Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  Export:
   Name: UserAcquisitionApiGatewayUrl
