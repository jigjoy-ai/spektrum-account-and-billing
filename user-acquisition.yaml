AWSTemplateFormatVersion: 2010-09-09
Description: >-
  puzzle-box-serverless - project domain

Transform:
  - AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:
  requestAccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/user-acquisition/adapters/primary/request-access/request-access-adapter.requestAccessHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Request Access on jigjoy.io website
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
        - DynamoDBCrudPolicy:
            TableName: !Ref AccessRequestTable
      Environment:
        Variables:
          ACCESS_REQUEST_TABLE: !Ref AccessRequestTable
          FROM_ADDRESS: "{{resolve:secretsmanager:vars:SecretString:FromAddress}}"
          ADMIN_EMAIL_1: "{{resolve:secretsmanager:vars:SecretString:AdminEmail1}}"
          ADMIN_EMAIL_2: "{{resolve:secretsmanager:vars:SecretString:AdminEmail2}}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /user-acquisition/request-access
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/user-acquisition/adapters/primary/request-access/request-access-adapter.ts

  createArticleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/create-article.createArticleHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Article creation
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArticleTable
      Environment:
        Variables:
          ARTICLE_TABLE: !Ref ArticleTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /user-acquisition/article
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/create-article-handler.ts

  AccessRequestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: AccessRequest
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userGSI
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ArticleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Article
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: statusGSI
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  UserAcquisitionApiGatewayUrl:
    Description: "API Gateway URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: UserAcquisitionApiGatewayUrl
