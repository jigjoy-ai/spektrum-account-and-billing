AWSTemplateFormatVersion: 2010-09-09
Description: >-
  puzzle-box-serverless - project domain

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"
      
Resources:
  implementRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/project-management/adapters/primary/implement-request/implement-request-adapter.implementRequestHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 100
      Description: Implement functionality with AI
      Environment:
        Variables:
          OPENAI_API_KEY: "{{resolve:secretsmanager:vars:SecretString:OpenaiApiKey}}"
          BUILD_API: "{{resolve:secretmanger:vars:SecretString:BuildApi}}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /project/implement
            Method: PUT
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/project-management/adapters/primary/implement-request/implement-request-adapter.ts

Outputs:
  ProjectManagementApiGatewayUrl:
    Description: "API Gateway URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: ProjectManagementApiGatewayUrl  # Logical name for the API Gateway URL
