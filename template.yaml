AWSTemplateFormatVersion: 2010-09-09
Description: >-
  puzzle-box-serverless

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:

  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "./auth.yaml"

  ProjectManagementStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "./project-management.yaml"

Outputs:
  AuthApiEndpoint:
    Description: "API Gateway endpoint for user authentication and authorization"
    Value: !GetAtt AuthStack.Outputs.AuthApiGatewayUrl
  ProjectManagementApiEndpoint:
    Description: "API Gateway endpoint URL for project management domain"
    Value: !GetAtt ProjectManagementStack.Outputs.ProjectManagementApiGatewayUrl