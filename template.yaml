AWSTemplateFormatVersion: 2010-09-09
Description: >-
  puzzle-box-serverless

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:

  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "./src/auth/auth.yaml"

  ProjectStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "./src/project/project.yaml"

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL for the main API"
    Value: !GetAtt ProjectStack.Outputs.ApiGatewayUrl