AWSTemplateFormatVersion: 2010-09-09
Description: >-
    Account and Billing is service for managing accounts and billing for the Spektrum AI coding platform.

Transform:
    - AWS::Serverless-2016-10-31

Resources:
    OrganizationTable:
        Type: AWS::DynamoDB::Table
        Properties:
            TableName: !Sub "${AWS::StackName}-Organization"
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - AttributeName: id
                  AttributeType: S
                - AttributeName: ownerId
                  AttributeType: S
            KeySchema:
                - AttributeName: id
                  KeyType: HASH
            GlobalSecondaryIndexes:
                - IndexName: ownerIdGSI
                  KeySchema:
                      - AttributeName: ownerId
                        KeyType: HASH
                  Projection:
                      ProjectionType: ALL

    OrganizationMemberTable:
        Type: AWS::DynamoDB::Table
        Properties:
            TableName: !Sub "${AWS::StackName}-OrganizationMember"
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - AttributeName: userId
                  AttributeType: S
                - AttributeName: organizationId
                  AttributeType: S
            KeySchema:
                - AttributeName: userId
                  KeyType: HASH
            GlobalSecondaryIndexes:
                - IndexName: organizationIdGSI
                  KeySchema:
                      - AttributeName: organizationId
                        KeyType: HASH
                      - AttributeName: userId
                        KeyType: RANGE
                  Projection:
                      ProjectionType: ALL

    ApiKeyTable:
        Type: AWS::DynamoDB::Table
        Properties:
            TableName: !Sub "${AWS::StackName}-ApiKey"
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - AttributeName: id
                  AttributeType: S
                - AttributeName: keyHash
                  AttributeType: S
                - AttributeName: organizationId
                  AttributeType: S
                - AttributeName: statusCreatedAt
                  AttributeType: S
            KeySchema:
                - AttributeName: id
                  KeyType: HASH
            GlobalSecondaryIndexes:
                - IndexName: keyHashGSI
                  KeySchema:
                      - AttributeName: keyHash
                        KeyType: HASH
                  Projection:
                      ProjectionType: ALL
                - IndexName: organizationIdStatusGSI
                  KeySchema:
                      - AttributeName: organizationId
                        KeyType: HASH
                      - AttributeName: statusCreatedAt
                        KeyType: RANGE
                  Projection:
                      ProjectionType: ALL

    ApiUsageTable:
        Type: AWS::DynamoDB::Table
        Properties:
            TableName: !Sub "${AWS::StackName}-ApiUsage"
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - AttributeName: id
                  AttributeType: S
                - AttributeName: apiKeyId
                  AttributeType: S
                - AttributeName: organizationId
                  AttributeType: S
                - AttributeName: occurredAt
                  AttributeType: S
            KeySchema:
                - AttributeName: id
                  KeyType: HASH
                - AttributeName: occurredAt
                  KeyType: RANGE
            GlobalSecondaryIndexes:
                - IndexName: apiKeyIdGSI
                  KeySchema:
                      - AttributeName: apiKeyId
                        KeyType: HASH
                      - AttributeName: occurredAt
                        KeyType: RANGE
                  Projection:
                      ProjectionType: ALL
                - IndexName: organizationIdGSI
                  KeySchema:
                      - AttributeName: organizationId
                        KeyType: HASH
                      - AttributeName: occurredAt
                        KeyType: RANGE
                  Projection:
                      ProjectionType: ALL

    JigJoyUserPool:
        Type: AWS::Cognito::UserPool
        Properties:
            UserPoolName: jigJoyUserPool
            Policies:
                PasswordPolicy:
                    MinimumLength: 8
            UsernameAttributes:
                - email
            Schema:
                - AttributeDataType: String
                  Name: email
                  Required: true
                - AttributeDataType: String
                  Mutable: true
                  Required: false
                  Name: authChallenge
            LambdaConfig:
                CreateAuthChallenge: !GetAtt CreateAuthChallenge.Arn
                DefineAuthChallenge: !GetAtt DefineAuthChallenge.Arn
                PreSignUp: !GetAtt PreSignUp.Arn
                PostAuthentication: !GetAtt PostAuthentication.Arn
                VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeResponse.Arn

    WebClient:
        Type: AWS::Cognito::UserPoolClient
        Properties:
            UserPoolId: !Ref JigJoyUserPool
            ClientName: webClient
            ExplicitAuthFlows:
                - ALLOW_CUSTOM_AUTH
                - ALLOW_REFRESH_TOKEN_AUTH
            PreventUserExistenceErrors: ENABLED
            AccessTokenValidity: 60
            IdTokenValidity: 60
            TokenValidityUnits:
                AccessToken: minutes
                IdToken: minutes

    EncryptionKey:
        Type: AWS::KMS::Key
        Properties:
            Enabled: true
            EnableKeyRotation: true
            KeyPolicy:
                Version: "2012-10-17"
                Id: key-default-1
                Statement:
                    - Sid: Enable IAM User Permissions
                      Effect: Allow
                      Principal:
                          AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
                      Action: kms:*
                      Resource: "*"
            MultiRegion: false
            PendingWindowInDays: 7

    DefineAuthChallenge:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/services/cognito-identity-management/triggers/define-auth-challenge.defineAuthChallengeHandler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/services/cognito-identity-management/triggers/define-auth-challenge.ts

    CreateAuthChallenge:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/services/cognito-identity-management/triggers/create-auth-challenge.createAuthChallengeHandler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/services/cognito-identity-management/triggers/create-auth-challenge.ts

    VerifyAuthChallengeResponse:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/services/cognito-identity-management/triggers/verify-auth-challenge-response.verifyAuthChallengeResponseHandler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
            Environment:
                Variables:
                    KMS_KEY_ID: !Ref EncryptionKey
            Policies:
                - Version: "2012-10-17"
                  Statement:
                      - Effect: Allow
                        Action: kms:Decrypt
                        Resource: !GetAtt EncryptionKey.Arn
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/services/cognito-identity-management/triggers/verify-auth-challenge-response.ts

    PreSignUp:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/services/cognito-identity-management/triggers/pre-sign-up.preSignUpHandler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/services/cognito-identity-management/triggers/pre-sign-up.ts

    PostAuthentication:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/services/cognito-identity-management/triggers/post-authentication.postAuthenticationHandler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
            Policies:
                - Statement:
                      - Sid: AttributesUpdate
                        Effect: Allow
                        Action:
                            - cognito-idp:AdminUpdateUserAttributes
                        Resource: "*"
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/services/cognito-identity-management/triggers/post-authentication.ts

    UserPoolCreateAuthChallengeLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: lambda:invokeFunction
            Principal: cognito-idp.amazonaws.com
            FunctionName: !GetAtt CreateAuthChallenge.Arn
            SourceArn: !GetAtt JigJoyUserPool.Arn

    UserPoolVerifyAuthChallengeResponseLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: lambda:invokeFunction
            Principal: cognito-idp.amazonaws.com
            FunctionName: !GetAtt VerifyAuthChallengeResponse.Arn
            SourceArn: !GetAtt JigJoyUserPool.Arn

    UserPoolDefineAuthChallengeLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: lambda:invokeFunction
            Principal: cognito-idp.amazonaws.com
            FunctionName: !GetAtt DefineAuthChallenge.Arn
            SourceArn: !GetAtt JigJoyUserPool.Arn

    UserPoolPreSignUpLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: lambda:invokeFunction
            Principal: cognito-idp.amazonaws.com
            FunctionName: !GetAtt PreSignUp.Arn
            SourceArn: !GetAtt JigJoyUserPool.Arn

    UserPoolPostAuthenticationLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: lambda:invokeFunction
            Principal: cognito-idp.amazonaws.com
            FunctionName: !GetAtt PostAuthentication.Arn
            SourceArn: !GetAtt JigJoyUserPool.Arn

    sendMagicLinkChallengeFunction:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/http/handlers/send-magic-link-challenge.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
            Description: Send magic link challenge to user email
            Environment:
                Variables:
                    KMS_KEY_ID: !Ref EncryptionKey
                    USER_POOL_ID: !Ref JigJoyUserPool
                    USER_POOL_CLIENT_ID: !Ref WebClient
                    ORGANIZATION_TABLE: !Ref OrganizationTable
                    ORGANIZATION_MEMBER_TABLE: !Ref OrganizationMemberTable
                    DESTINATION_URL: "{{resolve:secretsmanager:vars:SecretString:DestinationUrl}}"
                    FROM_ADDRESS: "{{resolve:secretsmanager:vars:SecretString:FromAddress}}"
                    RESEND_API_KEY: "{{resolve:secretsmanager:vars:SecretString:ResendApiKey}}"
            Policies:
                - Version: "2012-10-17"
                  Statement:
                      - Effect: Allow
                        Action: ses:SendEmail
                        Resource: "*"
                      - Effect: Allow
                        Action: kms:Encrypt
                        Resource: !GetAtt EncryptionKey.Arn
                      - Effect: Allow
                        Action:
                            - cognito-idp:AdminUpdateUserAttributes
                            - cognito-idp:AdminGetUser
                            - cognito-idp:AdminCreateUser
                        Resource: !GetAtt JigJoyUserPool.Arn
                      - Effect: Allow
                        Action:
                            - dynamodb:PutItem
                            - dynamodb:GetItem
                            - dynamodb:Query
                            - dynamodb:BatchWriteItem
                        Resource:
                            - !GetAtt OrganizationTable.Arn
                            - !Sub "${OrganizationTable.Arn}/index/*"
                            - !GetAtt OrganizationMemberTable.Arn
                            - !Sub "${OrganizationMemberTable.Arn}/index/*"
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/send-magic-link-challenge.ts

    verifyMagicLinkChallengeFunction:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/http/handlers/verify-magic-link-challenge.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
            Description: Verify magic link challenge
            Environment:
                Variables:
                    USER_POOL_ID: !Ref JigJoyUserPool
                    USER_POOL_CLIENT_ID: !Ref WebClient
                    KMS_KEY_ID: !Ref EncryptionKey
                    API_KEY_TABLE: !Ref ApiKeyTable
                    ORGANIZATION_TABLE: !Ref OrganizationTable
                    ORGANIZATION_MEMBER_TABLE: !Ref OrganizationMemberTable
            Policies:
                - Version: "2012-10-17"
                  Statement:
                      - Effect: Allow
                        Action: kms:Decrypt
                        Resource: !GetAtt EncryptionKey.Arn
                      - Effect: Allow
                        Action:
                            - cognito-idp:AdminGetUser
                            - cognito-idp:AdminUpdateUserAttributes
                        Resource: !GetAtt JigJoyUserPool.Arn
                      - Effect: Allow
                        Action:
                            - dynamodb:PutItem
                            - dynamodb:GetItem
                            - dynamodb:Query
                        Resource:
                            - !GetAtt OrganizationTable.Arn
                            - !Sub "${OrganizationTable.Arn}/index/*"
                            - !GetAtt OrganizationMemberTable.Arn
                            - !Sub "${OrganizationMemberTable.Arn}/index/*"
                            - !GetAtt ApiKeyTable.Arn
                            - !Sub "${ApiKeyTable.Arn}/index/*"
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/verify-magic-link-challenge.ts

    createApiKeyFunction:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/http/handlers/create-api-key.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
            Description: Create api key
            Environment:
                Variables:
                    API_KEY_TABLE: !Ref ApiKeyTable
                    ORGANIZATION_TABLE: !Ref OrganizationTable
                    ORGANIZATION_MEMBER_TABLE: !Ref OrganizationMemberTable
            Policies:
                - Version: "2012-10-17"
                  Statement:
                      - Effect: Allow
                        Action:
                            - dynamodb:PutItem
                            - dynamodb:GetItem
                            - dynamodb:Query
                        Resource:
                            - !GetAtt OrganizationTable.Arn
                            - !Sub "${OrganizationTable.Arn}/index/*"
                            - !GetAtt OrganizationMemberTable.Arn
                            - !Sub "${OrganizationMemberTable.Arn}/index/*"
                            - !GetAtt ApiKeyTable.Arn
                            - !Sub "${ApiKeyTable.Arn}/index/*"
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true

    processCreditsPurchaseFunction:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/http/handlers/process-credits-purchase.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
            Description: Process credits purchase
            Environment:
                Variables:
                    ORGANIZATION_TABLE: !Ref OrganizationTable
                    ORGANIZATION_MEMBER_TABLE: !Ref OrganizationMemberTable
                    FROM_ADDRESS: "{{resolve:secretsmanager:vars:SecretString:FromAddress}}"
                    RESEND_API_KEY: "{{resolve:secretsmanager:vars:SecretString:ResendApiKey}}"
            Policies:
                - Version: "2012-10-17"
                  Statement:
                      - Effect: Allow
                        Action:
                            - dynamodb:PutItem
                            - dynamodb:GetItem
                            - dynamodb:Query
                        Resource:
                            - !GetAtt OrganizationTable.Arn
                            - !Sub "${OrganizationTable.Arn}/index/*"
                            - !GetAtt OrganizationMemberTable.Arn
                            - !Sub "${OrganizationMemberTable.Arn}/index/*"
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true

    chargeFunction:
        Type: AWS::Serverless::Function
        Properties:
            Handler: src/infrastructure/http/handlers/charge.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            MemorySize: 128
            Timeout: 100
            Description: Charge credits
            Environment:
                Variables:
                    ORGANIZATION_TABLE: !Ref OrganizationTable
                    ORGANIZATION_MEMBER_TABLE: !Ref OrganizationMemberTable
            Policies:
                - Version: "2012-10-17"
                  Statement:
                      - Effect: Allow
                        Action: dynamodb:PutItem
                        Resource: !GetAtt OrganizationTable.Arn
                      - Effect: Allow
                        Action: dynamodb:GetItem
                        Resource: !GetAtt OrganizationTable.Arn
                      - Effect: Allow
                        Action: dynamodb:Query
                        Resource:
                            - !GetAtt OrganizationTable.Arn
                            - !Sub "${OrganizationTable.Arn}/index/*"
                            - !GetAtt OrganizationMemberTable.Arn
                            - !Sub "${OrganizationMemberTable.Arn}/index/*"
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: true
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/charge.ts

Outputs:
    OrganizationTableName:
        Value: !Ref OrganizationTable
        Export:
            Name: !Sub "${AWS::StackName}-OrganizationTableName"
    
    OrganizationMemberTableName:
        Value: !Ref OrganizationMemberTable
        Export:
            Name: !Sub "${AWS::StackName}-OrganizationMemberTableName"

    CognitoUserPoolId:
        Value: !Ref JigJoyUserPool
        Export:
            Name: !Sub "${AWS::StackName}-CognitoUserPoolId"

    CognitoUserPoolClientId:
        Value: !Ref WebClient
        Export:
            Name: !Sub "${AWS::StackName}-CognitoUserPoolClientId"

    SendMagicLinkChallengeFnArn:
        Value: !GetAtt sendMagicLinkChallengeFunction.Arn
        Export:
            Name: !Sub "${AWS::StackName}-SendMagicLinkChallengeFnArn"

    CreateApiKeyFnArn:
        Value: !GetAtt createApiKeyFunction.Arn
        Export:
            Name: !Sub "${AWS::StackName}-CreateApiKeyFnArn"

    VerifyMagicLinkChallengeFnArn:
        Value: !GetAtt verifyMagicLinkChallengeFunction.Arn
        Export:
            Name: !Sub "${AWS::StackName}-VerifyMagicLinkChallengeFnArn"

    ProcessCreditsPurchaseFnArn:
        Value: !GetAtt processCreditsPurchaseFunction.Arn
        Export:
            Name: !Sub "${AWS::StackName}-ProcessCreditsPurchaseFnArn"

    ChargeFnArn:
        Value: !GetAtt chargeFunction.Arn
        Export:
            Name: !Sub "${AWS::StackName}-ChargeFnArn"
