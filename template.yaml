AWSTemplateFormatVersion: 2010-09-09
Description: >-
  account-and-billing

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"
      
Resources:

  UserAcquisitionStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "./user-acquisition.yaml"

  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "./auth.yaml"

Outputs:
  UserAcquisitionApiEndpoint:
    Description: "API Gateway endpoint for user acquisition"
    Value: !GetAtt UserAcquisitionStack.Outputs.UserAcquisitionApiGatewayUrl
  AuthApiEndpoint:
    Description: "API Gateway endpoint for user authentication and authorization"
    Value: !GetAtt AuthStack.Outputs.AuthApiGatewayUrl