AWSTemplateFormatVersion: 2010-09-09
Description: >-
  account-and-billing

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"
      
Resources:
  refactoreProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/core/adapters/primary/refactor-project/refactor-project-adapter.refactorProjectHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Refactore project with AI
      Events:
        Api:
          Type: Api
          Properties:
            Path: /project/refactor
            Method: POST
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/core/adapters/primary/refactor-project/refactor-project-adapter.ts

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
