name: Deploy Backend (Dev Environment)
on:
  push:
    branches:
      - development

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Setup Profile
        run: |
          aws configure set region eu-west-1 --profile Development
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} --profile Development
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }} --profile Development

      - name: Build
        run: sam build --profile Development --use-container

      - name: Deploy backend to environment
        run: sam deploy --profile Development --no-confirm-changeset --no-fail-on-empty-changeset --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND