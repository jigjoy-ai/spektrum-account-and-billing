AWSTemplateFormatVersion: 2010-09-09
Description: >-
  puzzle-box-serverless - auth domain

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:
  # User Pool
  JigJoyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: jigJoyUserPool
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      UsernameAttributes:
        - email
      Schema:
        - AttributeDataType: String
          Name: email
          Required: true
        - AttributeDataType: String
          Mutable: true
          Required: false
          Name: authChallenge
      LambdaConfig:
        CreateAuthChallenge: !GetAtt CreateAuthChallenge.Arn
        DefineAuthChallenge: !GetAtt DefineAuthChallenge.Arn
        PreSignUp: !GetAtt PreSignUp.Arn
        PostAuthentication: !GetAtt PostAuthentication.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeResponse.Arn

  # Domain For Sending Confirmation Email
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref JigJoyUserPool
      Domain: "{{resolve:secretsmanager:vars:SecretString:UserPoolDomain}}"

  # Web Client
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref JigJoyUserPool
      ClientName: webClient
      ExplicitAuthFlows:
        - ALLOW_CUSTOM_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Id: key-default-1
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
      MultiRegion: false
      PendingWindowInDays: 7

  DefineAuthChallenge:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/auth/define-auth-challenge/define-auth-challenge.defineAuthChallengeHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/auth/define-auth-challenge/define-auth-challenge.ts

  CreateAuthChallenge:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/auth/create-auth-challenge/create-auth-challenge.createAuthChallengeHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/auth/create-auth-challenge/create-auth-challenge.ts

  VerifyAuthChallengeResponse:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/auth/verify-auth-challenge-response/verify-auth-challenge-response.verifyAuthChallengeResponseHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Environment:
        Variables:
          KMS_KEY_ID: !Ref EncryptionKey
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/auth/verify-auth-challenge-response/verify-auth-challenge-response.ts

  PreSignUp:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/auth/pre-sign-up/pre-sign-up.preSignUpHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/auth/pre-sign-up/pre-sign-up.ts

  PostAuthentication:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/auth/post-authentication/post-authentication.postAuthenticationHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Policies:
        - Statement:
            - Sid: AttributesUpdate
              Effect: Allow
              Action:
                - cognito-idp:AdminUpdateUserAttributes
              Resource: "*"
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/auth/post-authentication/post-authentication.ts

  UserPoolCreateAuthChallengeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:invokeFunction
      Principal: cognito-idp.amazonaws.com
      FunctionName: !GetAtt CreateAuthChallenge.Arn
      SourceArn: !GetAtt JigJoyUserPool.Arn

  UserPoolVerifyAuthChallengeResponseLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:invokeFunction
      Principal: cognito-idp.amazonaws.com
      FunctionName: !GetAtt VerifyAuthChallengeResponse.Arn
      SourceArn: !GetAtt JigJoyUserPool.Arn

  UserPoolDefineAuthChallengeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:invokeFunction
      Principal: cognito-idp.amazonaws.com
      FunctionName: !GetAtt DefineAuthChallenge.Arn
      SourceArn: !GetAtt JigJoyUserPool.Arn

  UserPoolPreSignUpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:invokeFunction
      Principal: cognito-idp.amazonaws.com
      FunctionName: !GetAtt PreSignUp.Arn
      SourceArn: !GetAtt JigJoyUserPool.Arn

  UserPoolPostAuthenticationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:invokeFunction
      Principal: cognito-idp.amazonaws.com
      FunctionName: !GetAtt PostAuthentication.Arn
      SourceArn: !GetAtt JigJoyUserPool.Arn

  sendMagicLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/auth/send-magic-link/send-magic-link.sendMagicLinkHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Send magic link to user email
      Environment:
        Variables:
          KMS_KEY_ID: !Ref EncryptionKey
          USER_POOL_ID: !Ref JigJoyUserPool
          SES_FROM_ADDRESS: team@jigjoy.io
          FRONTEND_URL: "{{resolve:secretsmanager:vars:SecretString:FrontendUrl}}"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action: kms:Encrypt
              Resource: !GetAtt EncryptionKey.Arn
            - Effect: Allow
              Action:
                ["cognito-idp:AdminUpdateUserAttributes", "cognito-idp:AdminGetUser", "cognito-idp:AdminCreateUser"]
              Resource: !GetAtt JigJoyUserPool.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /send-magic-link/
            Method: POST
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/auth/send-magic-link/send-magic-link.ts

Outputs:
  CognitoUserPoolId:
    Value: !Ref JigJoyUserPool
    Export:
      Name: CognitoUserPoolId

  CognitoUserPoolClientId:
    Value: !Ref WebClient
    Export:
      Name: CognitoUserPoolClientId

  AuthApiGatewayUrl:
    Description: "API Gateway URL for authentication and authorization"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/"
    Export:
      Name: AuthApiGatewayUrl  # Logical name for the API Gateway URL